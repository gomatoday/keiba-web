<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v5.0 学習用テーブルの作成</title>
<style>
  :root { --fg:#1d1d1f; --mute:#6b6b70; --line:#d9d9de; --bg:#fafafa; --acc:#1f5fbf; --bad:#b3261e; --ok:#1e7a3c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; color:var(--fg); background:var(--bg); line-height:1.6; }
  main { max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--mute); margin:0 0 24px; font-size:.92rem; }
  section { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  label.pick { display:flex; gap:12px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  label.pick span.t { width:7em; font-weight:600; }
  .cnt { color:var(--mute); font-size:.9rem; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:1px solid var(--acc); background:var(--acc); color:#fff; cursor:pointer; }
  button.sec { background:#fff; color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  progress { width:100%; height:10px; margin-top:12px; }
  pre { white-space:pre-wrap; font-size:.82rem; background:#f4f4f6; border-radius:8px; padding:10px 12px; max-height:420px; overflow:auto; margin:10px 0 0; }
  .note { font-size:.88rem; color:var(--mute); margin:6px 0 0; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>v5.0 学習用テーブルの作成（第1群）</h1>
  <p class="sub">保存した出走表・結果の .txt（中身はHTML）から、horses.csv・past_runs.csv・report.txt の3つを作ります。ファイルはこの端末の中だけで読み、どこにも送信しません。</p>

  <section>
    <h2>1. ファイルを選ぶ</h2>
    <label class="pick"><span class="t">出走表</span><input type="file" id="fRace" multiple accept=".txt,.html,.htm"><span class="cnt" id="cRace">0件</span></label>
    <label class="pick"><span class="t">結果</span><input type="file" id="fRes" multiple accept=".txt,.html,.htm"><span class="cnt" id="cRes">0件</span></label>
    <p class="note">ファイル名のどこかにレースID（16桁）があれば読みます。何回かに分けて選ぶと、選んだ分が追加されます。出走表の欄に結果のページ、結果の欄に出走表のページを選んでも、ページの題名を見て正しい側に入れ直します（報告に書きます）。</p>
    <div class="row"><button class="sec" id="bClear">選んだファイルを空にする</button></div>
  </section>

  <section>
    <h2>2. 作る</h2>
    <div class="row"><button id="bRun" disabled>学習用テーブルを作る</button></div>
    <progress id="prog" value="0" max="1" hidden></progress>
    <div id="status" class="note"></div>
  </section>

  <section id="outSec" hidden>
    <h2>3. 結果</h2>
    <div id="summary"></div>
    <div class="row">
      <button id="bH">horses.csv を保存</button>
      <button id="bP">past_runs.csv を保存</button>
      <button class="sec" id="bR">report.txt を保存</button>
    </div>
    <pre id="report"></pre>
  </section>
</main>

<script>
"use strict";
const VERSION = "learn-table-1 (2026-11-18)";
const CARD = new Map(), RES = new Map();      // rid -> File（選んだ欄）
const PICKLOG = [];
let outH = "", outP = "", outR = "";

const $ = id => document.getElementById(id);
const norm = s => (s || "").replace(/[\s　]+/g, " ").trim();
const txt = el => el ? norm(el.textContent) : "";
const z2h = s => (s || "").replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const numOr = s => { const m = z2h(s || "").replace(/,/g, "").match(/^-?\d+(?:\.\d+)?$/); return m ? m[0] : ""; };

/* ---------- 場の名前の表（固定） ---------- */
const REGION = {};
["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"].forEach(v => REGION[v] = "中央");
["大井","川崎","船橋","浦和"].forEach(v => REGION[v] = "南関東");
["門別","帯広","盛岡","水沢","金沢","笠松","名古屋","園田","姫路","高知","佐賀"].forEach(v => REGION[v] = "他地区");

function addFiles(list, map, label) {
  for (const f of list) {
    const m = f.name.match(/(\d{16})/);
    if (!m) { PICKLOG.push(label + ": " + f.name + "（名前にレースIDが無いので読みません）"); continue; }
    if (map.has(m[1])) PICKLOG.push(label + ": 同じレースID " + m[1] + " を2回選んだ（後の方を使用）");
    map.set(m[1], f);
  }
}
function refresh() {
  $("cRace").textContent = CARD.size + "件"; $("cRes").textContent = RES.size + "件";
  $("bRun").disabled = CARD.size + RES.size === 0;
}
$("fRace").addEventListener("change", e => { addFiles(e.target.files, CARD, "出走表"); e.target.value = ""; refresh(); });
$("fRes").addEventListener("change", e => { addFiles(e.target.files, RES, "結果"); e.target.value = ""; refresh(); });
$("bClear").onclick = () => { CARD.clear(); RES.clear(); PICKLOG.length = 0; refresh(); $("outSec").hidden = true; $("status").textContent = ""; };

async function readFile(file) {
  const buf = await file.arrayBuffer();
  let s;
  try { s = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch (e) { s = new TextDecoder("shift_jis").decode(buf); }
  return { html: s, doc: new DOMParser().parseFromString(s, "text/html") };
}
function kindOf(doc) {
  const t = doc.title || "";
  if (/成績/.test(t)) return "res";
  if (/レース情報/.test(t)) return "card";
  return "";
}
function idFrom(a, re) { const h = a ? a.getAttribute("href") || "" : ""; const m = h.match(re); return m ? m[1] : ""; }
function brParts(td) { return td ? td.innerHTML.split(/<br\s*\/?>/i).map(s => norm(s.replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " "))) : []; }
function ymd(y, m, d) { return y + String(m).padStart(2, "0") + String(d).padStart(2, "0"); }
function toDate(s) { return s && /^\d{8}$/.test(s) ? Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)) : null; }
function daysBetween(a, b) { const x = toDate(a), y = toDate(b); return x == null || y == null ? "" : String(Math.round((y - x) / 86400000)); }
function timeSec(s) {
  s = z2h(s || "").trim();
  let m = s.match(/^(\d+):(\d{1,2})\.(\d)$/); if (m) return (+m[1] * 60 + +m[2] + +m[3] / 10).toFixed(1);
  m = s.match(/^(\d{1,3})\.(\d)$/); if (m) return (+m[1] + +m[2] / 10).toFixed(1);
  return "";
}
function wakuOf(num, n) {                 // 8枠制の決まり（9頭以上は後ろの枠から2頭ずつ）
  num = +num; n = +n; if (!num || !n || num > n) return "";
  if (n <= 8) return String(num);
  const q = Math.floor(n / 8), r = n % 8; let c = 0;
  for (let w = 1; w <= 8; w++) { c += (w <= 8 - r) ? q : q + 1; if (num <= c) return String(w); }
  return "";
}

/* ---------- 見出し（出走表・結果で共通） ---------- */
function parseHeader(doc) {
  const o = {};
  const sub = doc.querySelector("p.nk23_c-tab1__subtitle");
  if (!sub) return null;
  o.rno = txt(sub.querySelector(".nk23_c-tab1__subtitle__label")).replace("R", "");
  const tx = [...sub.querySelectorAll(":scope > .nk23_c-tab1__subtitle__text")].map(txt);
  const dm = (tx[0] || "").match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
  o.date = dm ? ymd(dm[1], dm[2], dm[3]) : "";
  const km = (tx[1] || "").match(/第(\d+)回\s*(\S+?)競馬\s*第(\d+)日/);
  o.kai = km ? km[1] : ""; o.venue = km ? km[2] : ""; o.nichi = km ? km[3] : "";
  const bottom = sub.querySelector(".nk23_c-tab1__subtitle__bottom");
  const course = txt(bottom && bottom.querySelector("a"));
  const cm = course.match(/^(\D+?)\s*([\d,]+)m\s*(?:（(.*?)）)?/);
  o.surface = cm ? cm[1] : ""; o.dist = cm ? cm[2].replace(/,/g, "") : ""; o.inout = cm && cm[3] ? cm[3] : "";
  o.course_raw = course;
  const bt = txt(bottom);
  const hm = bt.match(/（(\d+)頭）/); o.heads_card = hm ? hm[1] : "";
  const tm = bt.match(/発走時刻\s*(\d{1,2}:\d{2})/); o.post_time = tm ? tm[1] : "";
  o.title_raw = txt(doc.querySelector("h3.nk23_c-tab1__title .nk23_c-tab1__title__text"));
  const gr = doc.querySelector(".nk23_c-tab1__accor__grtext .nk23_c-tab1__texts__gr");
  const g = gr ? [...gr.querySelectorAll(":scope > .nk23_c-tab1__text")].map(txt) : [];
  for (let i = 0; i < 5; i++) o["cond" + (i + 1)] = g[i] || "";
  o.cond_raw = g.filter(Boolean).join(" / ");
  const pz = txt(doc.querySelector(".nk23_c-tab1__accor__grtext")).match(/1着([\d,]+)円/);
  o.prize1 = pz ? pz[1].replace(/,/g, "") : "";
  return o;
}

/* ---------- 出走表: 基本の表 ---------- */
function parseBasic(doc) {
  const t = [...doc.querySelectorAll("table.nk23_c-table23__table")].find(x => x.querySelectorAll("tr").length > 1);
  const out = []; if (!t) return out;
  let waku = "";
  for (const tr of t.querySelectorAll("tr")) {
    let tds = [...tr.children].filter(x => x.tagName === "TD");
    if (tds.length < 10) continue;
    if (tds[0].hasAttribute("rowspan")) { waku = txt(tds[0]); tds = tds.slice(1); }
    const h = {};
    h.waku = waku; h.num_raw = txt(tds[0]);
    const na = tds[1].querySelector("a");
    h.horse_id = idFrom(na, /uma_info\/(\d+)/); h.name = txt(na) || txt(tds[1]);
    h.birth_raw = txt(tds[1].querySelector(".nk23_c-table23__txt3"));
    const sx = brParts(tds[2]); h.sexage = sx[0] || ""; h.color = sx[1] || "";
    const bw = brParts(tds[4]); h.bw = numOr(bw[0]); h.bw_diff_raw = bw[1] || "";
    const kt = txt(tds[5]); h.kin = numOr(kt.replace(/[^\d.]/g, "")); h.gen_mark = (kt.match(/[▲△☆◇★]/) || [""])[0];
    const ja = tds[6].querySelector("a");
    h.jockey_id = idFrom(ja, /kis_info\/(\w+)/); h.jockey = txt(ja);
    h.jockey_aff = (txt(tds[6]).match(/\(([^)]*)\)\s*$/) || ["", ""])[1];
    const pm = brParts(tds[7]); h.sire = pm[0] || ""; h.dam = pm[1] || "";
    const ta = tds[8].querySelector("a");
    h.trainer_id = idFrom(ta, /cho_info\/(\w+)/); h.trainer = txt(ta);
    h.trainer_aff = (txt(tds[8]).match(/\(([^)]*)\)\s*$/) || ["", ""])[1];
    const ps = [...tds[9].querySelectorAll("p")].map(txt);
    h.owner = ps[0] || ""; h.breeder = ps[1] || "";
    h.row_text = txt(tr);
    out.push(h);
  }
  return out;
}

/* ---------- 出走表: 過去走の欄 ---------- */
function parseRun(td) {
  const r = { exists: "0", abnormal: "", date: "", date_src: "", race_id: "", rno: "", venue: "", region: "", nankan4: "",
    dist: "", surface: "", inout: "", course_raw: "", baba: "", title_raw: "", label_raw: "", heads: "", num: "", waku: "",
    fin: "", fin_raw: "", pop: "", jockey: "", gen_mark: "", kin: "", bw: "", time: "", time_raw: "", margin: "",
    l3f: "", l3f_rank: "", pass_raw: "", pass1: "", pass2: "", pass3: "", pass4: "", pass_n: "", pass_last: "", winner: "", raw: "" };
  if (!td) return r;
  const all = txt(td);
  if (!all || all === "-" || all === "--") return r;
  r.exists = "1"; r.raw = all.slice(0, 300);
  if (/初出走時勝率/.test(all)) { r.abnormal = "初出走欄"; return r; }
  const fl = td.querySelector("p.nk23_u-d-flex");
  const sp = fl ? [...fl.children].filter(x => x.tagName === "SPAN") : [];
  r.fin_raw = txt(sp[0]).replace(/\s*着$/, "");
  const vd = txt(sp[1]);
  const vm = vd.match(/^(\D+?)(\d{2})\.(\d{1,2})\.(\d{1,2})$/);
  if (vm) { r.venue = vm[1]; }
  const crs = txt(sp[2]);                                   // 「良外ダ 1200」「稍内芝 1600」「800」（能試）
  r.course_raw = crs;
  const cm = crs.match(/^(良|稍|重|不)?(内|外)?(ダ|芝|障)?\s*(\d{3,4})$/);
  if (cm) { r.baba = cm[1] || ""; r.inout = cm[2] || ""; r.surface = cm[3] || ""; r.dist = cm[4]; }
  if (/能試/.test(r.fin_raw)) r.abnormal = "能試";
  else if (!/^\d+$/.test(r.fin_raw)) r.abnormal = r.fin_raw || "不明";
  else r.fin = r.fin_raw;
  // 日付: rcd（南関東）→ 欄の表記（他地区・中央）
  const rcd = td.querySelector("input[id^='rcd_']");
  if (rcd && /^\d{8}$/.test(rcd.value || "")) { r.date = rcd.value; r.date_src = "rcd"; }
  else if (vm) { r.date = ymd(2000 + +vm[2], vm[3], vm[4]); r.date_src = "表記"; }
  // レースID: 結果へのリンク → rc の値
  const a = td.querySelector("a.race_name_len") || td.querySelector("a[href*='/result/']");
  if (a) r.race_id = idFrom(a, /result\/(\d{16})/);
  if (!r.race_id) { const ip = td.querySelector("input[id^='rc_']"); if (ip && /^\d{16}$/.test(ip.value || "")) r.race_id = ip.value; }
  if (r.race_id) r.rno = String(+r.race_id.slice(14, 16));
  const nm = td.querySelector(".race_name_len");
  if (nm) { r.title_raw = nm.getAttribute("title") || ""; r.label_raw = txt(nm); }
  r.region = REGION[r.venue] || (r.venue ? "不明" : "");
  r.nankan4 = r.region === "南関東" ? r.venue : "";
  const pop = td.querySelector("span.popularity");
  if (pop) {
    const t = txt(pop);
    r.heads = (t.match(/(\d+)頭/) || ["", ""])[1]; r.num = (t.match(/(\d+)番/) || ["", ""])[1]; r.pop = (t.match(/(\d+)人気/) || ["", ""])[1];
    const jk = pop.nextElementSibling;
    if (jk) {
      let jt = txt(jk);
      const mk = jt.match(/^([▲△☆◇★])\s*(.*)$/); if (mk) { r.gen_mark = mk[1]; jt = mk[2]; }
      const m = jt.match(/^(.*?)\s*(\d+(?:\.\d)?)$/);
      if (m) { r.jockey = m[1]; r.kin = m[2]; } else r.jockey = jt;
    }
  }
  r.waku = wakuOf(r.num, r.heads);
  r.bw = numOr(txt(td.querySelector("span.weight")).replace(/kg$/, ""));
  r.winner = txt(td.querySelector("span.winner"));
  const rt = txt(td.querySelector("span.racetime")); const rm = rt.match(/^(\S+)\s*(?:\(([^)]*)\))?/);
  if (rm) { r.time_raw = rm[1]; r.time = timeSec(rm[1]); r.margin = numOr(rm[2] || ""); }
  const ft = txt(td.querySelector("span.furlongtime")); const fm = ft.match(/3F\s*([\d.]+)\s*(?:\((\d+)\))?/);
  if (fm) { r.l3f = fm[1]; r.l3f_rank = fm[2] || ""; }
  const pos = td.querySelector("p.position");
  if (pos) {
    const ps = [...pos.querySelectorAll("span")].map(txt).filter(Boolean);
    r.pass_raw = ps.join(" "); r.pass_n = ps.length ? String(ps.length) : "";
    ps.slice(0, 4).forEach((v, i) => r["pass" + (i + 1)] = numOr(v));
    r.pass_last = ps.length ? numOr(ps[ps.length - 1]) : "";
  }
  return r;
}

/* ---------- 出走表: 詳細の表 ---------- */
const A_CELLS = [["a_besttime", "mk-btm"], ["a_dist_rec", "mk-oky"], ["a_venue_rec", "mk-ojo"], ["a_jky_rec", "mk-kwc"], ["a_jky_pct", "mk-kwp"],
  ["a_baba_rec", "mk-baba"], ["a_intv_rec", "mk-intv"], ["a_sire", "mk-sire"], ["a_season_rec", "mk-kise"], ["a_jky_course", "mk-kco"],
  ["a_ret_horse", "mk-hrtn"], ["a_ret_jky", "mk-krtn"], ["a_ai_course", "cs-ai1"], ["a_ai_trainer", "cs-ai2"], ["a_bw_win", "mk-wre"]];
function cellRaw(td) {
  if (!td) return "";
  const ps = [...td.querySelectorAll("p")];
  if (ps.length) return ps.map(p => norm(p.innerHTML.replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ")) || "_").join(" | ");
  return txt(td);
}
function parseDetail(doc) {
  const t = doc.querySelector("table.tb-shousai");
  const out = []; if (!t) return { rows: out, labels: "" };
  const labs = [];
  for (const th of t.querySelectorAll("th")) {
    const cls = [...th.classList].find(c => /^cs-/.test(c)); const tt = txt(th);
    if (cls && /\d{3,4}|浦和|良|日未満|月～|今回騎手|単勝/.test(tt) && tt.length < 120) labs.push(cls + "=" + tt);
  }
  for (const tr of t.querySelectorAll("tr")) {
    const ub = tr.querySelector("td.umaban"); if (!ub) continue;
    const d = {}; d.num_raw = txt(ub);
    const nm = tr.querySelector("td.pr-umaName-textRound");
    const na = nm ? nm.querySelector("a") : null; d.horse_id = idFrom(na, /uma_info\/(\d+)/);
    const ps = nm ? [...nm.querySelectorAll("p.nk23_u-text10")].map(txt) : [];
    const bms = ps.find(s => /^（.*）$/.test(s)); d.damsire = bms ? bms.slice(1, -1) : "";
    const g1 = tr.querySelector("td.cs-g1");
    const gp = g1 ? [...g1.querySelectorAll("p.nk23_c-table22__Grouptxt")] : [];
    d.gen_mark = ""; if (gp[0]) { const m = txt(gp[0]).match(/^([▲△☆◇★])/); if (m) d.gen_mark = m[1]; }
    d.kin_detail = gp[0] ? numOr(txt(gp[0].querySelector(".nk23_u-text12"))) : "";
    const lic = tr.querySelector("input[name='jockey_license']"); d.jockey_lic = lic ? lic.value : "";
    const g2 = tr.querySelector("td.cs-g2"); const bw = brParts(g2); d.bw = numOr(bw[0]); d.bw_diff_raw = bw[1] || "";
    d.runs = [1, 2, 3, 4, 5].map(k => parseRun(tr.querySelector("td.cs-z" + k)));
    A_CELLS.forEach(([c, cls]) => d[c] = cellRaw(tr.querySelector("td." + cls)));
    out.push(d);
  }
  return { rows: out, labels: labs.join(" || ") };
}

/* ---------- 結果 ---------- */
function parseResult(doc) {
  const o = { rows: new Map(), weather: "", baba: "", tan: new Map(), fuku: new Map(), wins: 0 };
  const lab = doc.querySelector("p.nk23_c-table01__txt");
  const lt = txt(lab) || txt(doc.body).slice(0, 20000);
  const w = lt.match(/天候:\s*(\S+)/); o.weather = w ? w[1] : "";
  const b = lt.match(/馬場:\s*(\S+\s*\S+)/); o.baba = b ? b[1] : "";
  const t = [...doc.querySelectorAll("table.nk23_c-table01__table")].find(x => /馬名/.test(txt(x.querySelector("tr"))) && /人気/.test(txt(x.querySelector("tr"))));
  if (t) {
    let prevFin = "";
    for (const tr of [...t.querySelectorAll("tr")].slice(1)) {
      const tds = [...tr.children].filter(x => x.tagName === "TD");
      if (tds.length < 15) continue;
      const v = tds.map(txt);
      const r = { fin_raw: v[0], waku: v[1], num: v[2], horse_id: idFrom(tds[3].querySelector("a"), /uma_info\/(\d+)/),
        kin: numOr(v[5]), bw: numOr(v[6].replace(/kg$/, "")), bw_diff_raw: v[7], time_raw: v[10], margin_raw: v[11],
        l3f: numOr(v[12]), pass_raw: v[13], pop: numOr(v[14]) };
      r.fin = /^\d+$/.test(r.fin_raw) ? r.fin_raw : (/同着/.test(r.fin_raw) && prevFin ? prevFin : "");   // 「同着」は上の行と同じ着順
      if (r.fin) prevFin = r.fin;
      if (r.fin === "1") o.wins++;
      if (r.num) o.rows.set(r.num, r);
    }
  }
  const pt = [...doc.querySelectorAll("table.nk23_c-table01__table")].find(x => /組番/.test(txt(x.querySelector("tr"))) && /単勝/.test(txt(x)) && x.querySelectorAll("tr").length > 6);
  o.pay_found = !!pt;
  if (pt) {
    let kind = "";
    for (const tr of pt.querySelectorAll("tr")) {
      const cells = [...tr.children];
      if (cells.length && cells[0].tagName === "TH") { kind = txt(cells[0]); cells.shift(); }
      const v = cells.map(txt);
      if (v.length >= 2 && /^\d+$/.test(v[0])) {
        const amt = v[1].replace(/[,円]/g, "");
        if (kind === "単勝") o.tan.set(v[0], amt); else if (kind === "複勝") o.fuku.set(v[0], amt);
      }
    }
  }
  return o;
}

/* ---------- 列 ---------- */
const R_COLS = ["race_id", "date", "venue", "kai", "nichi", "rno", "post_time", "dist", "surface", "inout", "course_raw", "title_raw", "cond_raw",
  "cond1", "cond2", "cond3", "cond4", "cond5", "prize1", "heads_card", "heads", "n_scratched", "baba", "weather", "lab_raw"].map(c => "r_" + c);

  "pass_raw", "pass1", "pass2", "pass3", "pass4", "pass_n", "pass_last", "winner", "raw", "link", "prize1", "link_title_raw", "link_cond_raw", "link_weather", "link_baba"];

/* ---------- 実行 ---------- */
$("bRun").onclick = async () => {

    ["date", "venue", "kai", "nichi", "rno", "post_time", "dist", "surface", "inout", "course_raw", "title_raw", "cond_raw", "cond1", "cond2", "cond3", "cond4", "cond5", "prize1", "heads_card"]

    for (const h of basic) {

      const r1 = runs[0];

  if (info.length > 500) rep.push("  …ほか " + (info.length - 500) + "件");

  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;

}

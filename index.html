<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南関東競馬分析 v4.7</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>南関東競馬分析 v4.7</h1>
  <nav><a href="index.html" class="on">分析</a><a href="kekka.html">結果入力</a><a href="data.html">記録</a><a href="test.html">一致テスト</a></nav>
</header>
<div id="bkstat" class="bkstat"></div>
<main>
  <section class="card" id="input">
    <h2>出走表HTML</h2>
    <label class="file">
      <input type="file" id="html" accept=".html,.htm,.txt,text/html,text/plain">
    </label>
    <div class="row">
      <label>会場
        <select id="venue">
          <option value="">HTMLから読み取る</option>
          <option>浦和</option><option>船橋</option><option>大井</option><option>川崎</option>
        </select>
      </label>
      <label>R
        <select id="rno">
          <option value="">HTMLから読み取る</option>
        </select>
      </label>
    </div>
    <p class="hint">会場とRを選ぶと、HTMLの内容と一致するかを確認します（違えば停止）。</p>
    <button id="run" disabled>分析開始</button>
    <p id="status" class="status">準備中…</p>
  </section>

  <section class="card hidden" id="summary"></section>

  <section class="card hidden" id="result">
    <div class="tools">
      <button id="save" class="sub">分析出力を保存（分析出力.txt）</button> <a href="kekka.html" id="tokekka" class="btnlink">このレースの結果を入力 →</a>
    </div>
    <div id="out"></div>
  </section>
</main>
<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/pyodide/v0.29.5/full/pyodide.js"></script>
<script src="bundle.js"></script>
<script src="common.js"></script>
<script src="storage.js"></script>
<script src="app.js"></script>
</body>
</html>
